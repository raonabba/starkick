const B = 500, R = 18, FRIC = 0.92, CD = 3;

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

function initStars(z,p){
  return z.starPositions.map((pos,i)=>({
    id:`p${p}_s${i}`,player:p,
    x:p===1?pos[0]*B/100:B-pos[0]*B/100,
    y:p===1?pos[1]*B/100:B-pos[1]*B/100,
    vx:0,vy:0,alive:true,frozen:false,shielded:false,revive:false,glowing:false,
  }));
}

// ── Web Audio ──────────────────────────────────────────────────────
let _audioCtx=null;
function getAC(){
  if(!_audioCtx) _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==="suspended") _audioCtx.resume();
  return _audioCtx;
}
function playSound(type){
  try{
    const ctx=getAC(), now=ctx.currentTime;
    if(type==="launch"){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type="sawtooth";
      o.frequency.setValueAtTime(400,now);
      o.frequency.exponentialRampToValueAtTime(80,now+0.18);
      g.gain.setValueAtTime(0.3,now);
      g.gain.exponentialRampToValueAtTime(0.001,now+0.18);
      o.start(now);o.stop(now+0.18);
    } else if(type==="hit"){
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.12,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5);
      const src=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      src.buffer=buf;f.type="bandpass";f.frequency.value=800;f.Q.value=0.8;
      src.connect(f);f.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(0.7,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.12);
      src.start(now);
      const o2=ctx.createOscillator(),g2=ctx.createGain();
      o2.connect(g2);g2.connect(ctx.destination);o2.type="sine";
      o2.frequency.setValueAtTime(200,now);o2.frequency.exponentialRampToValueAtTime(40,now+0.1);
      g2.gain.setValueAtTime(0.4,now);g2.gain.exponentialRampToValueAtTime(0.001,now+0.1);
      o2.start(now);o2.stop(now+0.1);
    } else if(type==="destroy"){
      const buf=ctx.createBuffer(1,ctx.sampleRate*0.4,ctx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5)*0.8;
      const src=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      src.buffer=buf;f.type="lowpass";f.frequency.value=600;
      src.connect(f);f.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(0.8,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);
      src.start(now);
      [0,0.05,0.1].forEach((dl,i)=>{
        const o=ctx.createOscillator(),gg=ctx.createGain();
        o.connect(gg);gg.connect(ctx.destination);o.type="sine";o.frequency.value=800+i*300;
        gg.gain.setValueAtTime(0.15,now+dl);gg.gain.exponentialRampToValueAtTime(0.001,now+dl+0.15);
        o.start(now+dl);o.stop(now+dl+0.15);
      });
    } else if(type==="skill"){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.type="square";
      o.frequency.setValueAtTime(100,now);o.frequency.exponentialRampToValueAtTime(600,now+0.3);
      g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(0.35,now+0.15);
      g.gain.exponentialRampToValueAtTime(0.001,now+0.4);
      o.start(now);o.stop(now+0.4);
      const buf2=ctx.createBuffer(1,ctx.sampleRate*0.2,ctx.sampleRate);
      const d2=buf2.getChannelData(0);
      for(let i=0;i<d2.length;i++) d2[i]=(Math.random()*2-1)*0.3;
      const src2=ctx.createBufferSource(),g2=ctx.createGain(),f2=ctx.createBiquadFilter();
      src2.buffer=buf2;f2.type="highpass";f2.frequency.value=2000;
      src2.connect(f2);f2.connect(g2);g2.connect(ctx.destination);
      g2.gain.setValueAtTime(0.4,now+0.25);g2.gain.exponentialRampToValueAtTime(0.001,now+0.45);
      src2.start(now+0.25);
    } else if(type==="freeze"){
      [0,0.08,0.16,0.22].forEach((dl,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);o.type="triangle";o.frequency.value=1200-i*100;
        g.gain.setValueAtTime(0.2,now+dl);g.gain.exponentialRampToValueAtTime(0.001,now+dl+0.3);

      });
    } else if(type==="victory"){

        o.connect(g);g.connect(ctx.destination);o.type="triangle";o.frequency.value=freq;
        g.gain.setValueAtTime(0.25,now+i*0.12);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.12+0.35);
        o.start(now+i*0.12);o.stop(now+i*0.12+0.35);
      });
    }
  }catch(e){}
}

// ── StarShape (SVG 별 모양) ──────────────────────────────────────────
function StarShape({x,y,r,color,glow,glowing,frozen,shielded}){
  const pts=Array.from({length:5},(_,i)=>{
    const a=(i*72-90)*Math.PI/180,ai=a+36*Math.PI/180,or=r,ir=r*0.45;
    return `${x+or*Math.cos(a)},${y+or*Math.sin(a)} ${x+ir*Math.cos(ai)},${y+ir*Math.sin(ai)}`;
  }).join(" ");
  return h("g",null,
    glowing&&h("circle",{cx:x,cy:y,r:r+8,fill:glow,opacity:0.6},
      h("animate",{attributeName:"r",values:`${r+6};${r+12};${r+6}`,dur:"1s",repeatCount:"indefinite"}),
      h("animate",{attributeName:"opacity",values:"0.6;0.2;0.6",dur:"1s",repeatCount:"indefinite"})
    ),
    shielded&&h("circle",{cx:x,cy:y,r:r+6,fill:"none",stroke:"#87CEEB",strokeWidth:2,opacity:0.8},
      h("animate",{attributeName:"r",values:`${r+4};${r+8};${r+4}`,dur:"0.8s",repeatCount:"indefinite"})
    ),
    frozen&&h("circle",{cx:x,cy:y,r:r+4,fill:"rgba(100,200,255,0.3)",stroke:"rgba(100,200,255,0.8)",strokeWidth:1.5}),
    h("polygon",{points:pts,fill:color,stroke:"rgba(255,255,255,0.6)",strokeWidth:1,
      filter:glowing?`drop-shadow(0 0 6px ${color})`:`drop-shadow(0 0 3px ${color})`,opacity:frozen?0.6:1}),
    h("circle",{cx:x,cy:y,r:3,fill:"white",opacity:0.9})
  );
}

// ── 메인 앱 ─────────────────────────────────────────────────────────
function App(){
  const [phase,setPhase]=useState("select");
  const [p1Z,setP1Z]=useState(null);
  const [p2Z,setP2Z]=useState(null);
  const [step,setStep]=useState(1);
  const [stars,setStars]=useState([]);
  const [turn,setTurn]=useState(1);
  const [drag,setDrag]=useState(null);
  const [dragPos,setDragPos]=useState(null);
  const [lines,setLines]=useState({1:[],2:[]});
  const [cd,setCd]=useState({1:0,2:0});
  const [winner,setWinner]=useState(null);
  const [log,setLog]=useState("");
  const [particles,setParticles]=useState([]);
  const [dblPow,setDblPow]=useState({1:false,2:false});
  const [cinematic,setCinematic]=useState(null);
  const [shake,setShake]=useState(false);
  const [tint,setTint]=useState(null);
  const svgRef=useRef(null);
  const starsRef=useRef(stars);
  starsRef.current=stars;

  const bgStars=useRef(Array.from({length:100},()=>({x:Math.random()*100,y:Math.random()*100,r:Math.random()*1.2+0.3,delay:Math.random()*3,dur:2+Math.random()*2}))).current;

  // CSS 한 번만 주입
  useEffect(()=>{
    const s=document.createElement("style");
    s.textContent=`
      @keyframes cinematicIn{from{opacity:0;transform:scale(0.85) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
      @keyframes cinematicOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.05)}}
      @keyframes glowPulse{0%,100%{box-shadow:0 0 30px var(--skill-color),0 0 60px var(--skill-color)}50%{box-shadow:0 0 60px var(--skill-color),0 0 120px var(--skill-color)}}
      @keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px) rotate(-1deg)}30%{transform:translateX(8px) rotate(1deg)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
      @keyframes tintFlash{0%{opacity:0}20%{opacity:1}70%{opacity:0.6}100%{opacity:0}}
      @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    `;
    document.head.appendChild(s);
    return()=>s.remove();
  },[]);

  // 물리 tick
  const tick=useCallback(()=>{
    setStars(prev=>{
      const next=prev.map(s=>({...s}));
      for(const s of next){
        if(!s.alive)continue;
        s.x+=s.vx;s.y+=s.vy;
        s.vx*=FRIC;s.vy*=FRIC;
        if(Math.abs(s.vx)<0.05)s.vx=0;
        if(Math.abs(s.vy)<0.05)s.vy=0;
      }
      for(let i=0;i<next.length;i++){
        for(let j=i+1;j<next.length;j++){
          const a=next[i],b=next[j];
          if(!a.alive||!b.alive)continue;
          const d=dist(a,b);
          if(d<R*2&&d>0){
            const nx=(b.x-a.x)/d,ny=(b.y-a.y)/d,ov=R*2-d;
            a.x-=nx*ov/2;a.y-=ny*ov/2;b.x+=nx*ov/2;b.y+=ny*ov/2;
            const rv=a.vx-b.vx,ry=a.vy-b.vy,dot=rv*nx+ry*ny;
            if(dot>0){
              a.vx-=dot*nx;a.vy-=dot*ny;b.vx+=dot*nx;b.vy+=dot*ny;
              if(Math.abs(dot)>3)playSound("hit");
            }
          }
        }
      }
      for(const s of next){
        if(!s.alive)continue;
        if(s.x<-R||s.x>B+R||s.y<-R||s.y>B+R){
          if(s.revive){s.x=B/2+(Math.random()-0.5)*100;s.y=B/2+(Math.random()-0.5)*100;s.vx=0;s.vy=0;s.revive=false;}
          else{s.alive=false;playSound("destroy");}
        }
      }
      const p1a=next.filter(s=>s.player===1&&s.alive).length;
      const p2a=next.filter(s=>s.player===2&&s.alive).length;
      if(p1a===0){setWinner(2);setPhase("result");playSound("victory");}
      if(p2a===0){setWinner(1);setPhase("result");playSound("victory");}
      return next;
    });
  },[]);

  useEffect(()=>{
    if(phase!=="game")return;
    const id=setInterval(tick,16);
    return()=>clearInterval(id);
  },[phase,tick]);

  function addParticles(x,y,color){
    const ps=Array.from({length:8},(_,i)=>({id:Date.now()+i,x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,color:color||"#fff"}));
    setParticles(p=>[...p,...ps]);
    setTimeout(()=>setParticles(p=>p.filter(pp=>!ps.find(q=>q.id===pp.id))),800);
  }

  function getSVGPos(e){
    const svg=svgRef.current;if(!svg)return{x:0,y:0};
    const rect=svg.getBoundingClientRect();
    return{x:(e.clientX-rect.left)*B/rect.width,y:(e.clientY-rect.top)*B/rect.height};
  }

  function onStarDown(e,star){
    e.preventDefault();e.stopPropagation();
    if(star.player!==turn)return;
    if(star.frozen){setLog("❄️ 얼어있어서 움직일 수 없어요!");return;}
    const raw=e.touches?e.touches[0]:e;
    setDrag({id:star.id,startX:star.x,startY:star.y});
    setDragPos(getSVGPos(raw));
  }

  const onMove=useCallback((e)=>{
    if(!drag)return;
    if(e.cancelable)e.preventDefault();
    const raw=e.touches?e.touches[0]:e;
    setDragPos(getSVGPos(raw));
  },[drag]);

  const onUp=useCallback((e)=>{
    if(!drag)return;
    const raw=e.changedTouches?e.changedTouches[0]:e;
    const end=getSVGPos(raw);
    const star=starsRef.current.find(s=>s.id===drag.id);
    if(star){
      const dx=drag.startX-end.x,dy=drag.startY-end.y,mag=Math.hypot(dx,dy);
      if(mag>5){
        const spd=Math.min(mag*0.18,22),pw=dblPow[turn]?2:1;
        const vx=(dx/mag)*spd*pw,vy=(dy/mag)*spd*pw;
        setStars(prev=>prev.map(s=>s.id===star.id?{...s,vx,vy,glowing:true}:s));
        setTimeout(()=>setStars(prev=>prev.map(s=>s.id===star.id?{...s,glowing:false}:s)),800);
        if(dblPow[turn])setDblPow(p=>({...p,[turn]:false}));
        setLines(prev=>{
          const cur=prev[turn];if(cur.length>=4)return prev;
          const alive=starsRef.current.filter(s=>s.player===turn&&s.alive);
          if(alive.length>=2){
            const idx=alive.findIndex(s=>s.id===star.id);
            const ns=alive[(idx+1)%alive.length];
            if(ns&&ns.id!==star.id) return{...prev,[turn]:[...cur,{x1:star.x,y1:star.y,x2:ns.x,y2:ns.y}]};
          }
          return prev;
        });
        setCd(p=>({...p,[turn]:Math.max(0,p[turn]-1)}));
        setTurn(t=>t===1?2:1);
        setLog("");
        playSound("launch");
      }
    }
    setDrag(null);setDragPos(null);
  },[drag,turn,dblPow]);

  useEffect(()=>{
    const noScroll=(e)=>{if(drag&&e.cancelable)e.preventDefault();};
    window.addEventListener("touchmove",noScroll,{passive:false});
    window.addEventListener("touchend",onUp,{passive:true});
    window.addEventListener("mousemove",onMove);
    window.addEventListener("mouseup",onUp);
    return()=>{
      window.removeEventListener("touchmove",noScroll);
      window.removeEventListener("touchend",onUp);
      window.removeEventListener("mousemove",onMove);
      window.removeEventListener("mouseup",onUp);
    };
  },[drag,onMove,onUp]);

  function triggerCinematic(zodiac,onComplete){
    const fx=SKILL_FX[zodiac.skillType]||{};
    setCinematic({zodiac,flavorText:zodiac.skillFlavorText});
    playSound(zodiac.skillType==="freeze"?"freeze":"skill");
    if(fx.screenTint){setTint(fx.screenTint);setTimeout(()=>setTint(null),1800);}
    if(fx.shake){setShake(true);setTimeout(()=>setShake(false),500);}
    setTimeout(()=>{setCinematic(null);if(onComplete)onComplete();},2200);
  }

  function doSkill(){
    if(cd[turn]>0){setLog(`⏳ 스킬 재사용까지 ${cd[turn]}턴 남았어요!`);return;}
    const z=turn===1?p1Z:p2Z;
    const type=z.skillType;
    triggerCinematic(z,()=>{
      const t=turn;
      if(type==="shield"){
        setStars(prev=>prev.map(s=>s.player===t&&s.alive?{...s,shielded:true}:s));
        setTimeout(()=>setStars(prev=>prev.map(s=>s.player===t?{...s,shielded:false}:s)),3000);
        setLog(`🛡️ ${z.skillName} 발동! 이번 턴 방어!`);
      } else if(type==="freeze"){
        const enemy=starsRef.current.filter(s=>s.player!==t&&s.alive);
        if(enemy.length>0){const tg=enemy[Math.floor(Math.random()*enemy.length)];
          setStars(prev=>prev.map(s=>s.id===tg.id?{...s,frozen:true}:s));
          setTimeout(()=>setStars(prev=>prev.map(s=>s.id===tg.id?{...s,frozen:false}:s)),4000);
          setLog(`❄️ ${z.skillName} 발동! 상대 별이 얼었어요!`);}
      } else if(type==="reset"){
        const z1=t===1?p1Z:p2Z,z2=t===1?p2Z:p1Z;
        setStars([...initStars(z1,t),...initStars(z2,t===1?2:1)]);
        setLines({1:[],2:[]});setLog(`⚖️ ${z.skillName} 발동! 초기화!`);
      } else if(type==="double_power"||type==="power_shot"){
        setDblPow(p=>({...p,[t]:true}));setLog(`⚡ ${z.skillName} 발동! 다음 공격 2배!`);
      } else if(type==="revive"){
        setStars(prev=>prev.map(s=>s.player===t&&s.alive?{...s,revive:true}:s));
        setLog(`🦁 ${z.skillName} 발동! 한 번 부활 가능!`);
      } else if(type==="respawn"||type==="relocate"||type==="heal"){
        const dead=starsRef.current.filter(s=>s.player===t&&!s.alive);
        if(dead.length>0){const tg=dead[0];
          setStars(prev=>prev.map(s=>s.id===tg.id?{...s,alive:true,x:t===1?50+Math.random()*100:B-150+Math.random()*100,y:B/2+(Math.random()-0.5)*100,vx:0,vy:0}:s));
          setLog(`✨ ${z.skillName} 발동! 별이 돌아왔어요!`);
        }else{setLog("되살릴 별이 없어요!");return;}
      } else if(type==="teleport"){
        const enemy=starsRef.current.filter(s=>s.player!==t&&s.alive);
        if(enemy.length>0){const tg=enemy[Math.floor(Math.random()*enemy.length)];
          setStars(prev=>prev.map(s=>s.id===tg.id?{...s,x:R+Math.random()*(B-R*2),y:R+Math.random()*(B-R*2),vx:0,vy:0}:s));
          setLog(`🐐 ${z.skillName} 발동! 상대 별이 사라졌어요!`);}
      } else if(type==="clone"){
        setLog(`👥 ${z.skillName} - 상대가 혼란에 빠졌어요!`);
      } else if(type==="piercing"){
        const ms=starsRef.current.find(s=>s.player===t&&s.alive);
        if(ms){const angle=t===1?0:Math.PI;
          setStars(prev=>prev.map(s=>s.id===ms.id?{...s,vx:Math.cos(angle)*20,vy:0}:s));
          setLog(`🏹 ${z.skillName} 발동! 황금 화살!`);setTurn(tt=>tt===1?2:1);}
      }
      setCd(p=>({...p,[t]:CD}));
      setTurn(tt=>tt===1?2:1);
    });
  }

  function startGame(){
    if(!p1Z||!p2Z)return;
    setStars([...initStars(p1Z,1),...initStars(p2Z,2)]);
    setLines({1:[],2:[]});setTurn(1);setCd({1:0,2:0});setWinner(null);
    setLog("🌟 게임 시작! 별을 드래그해서 발사하세요!");setPhase("game");
  }

  const rootStyle={minHeight:"100vh",background:"#060d1e",display:"flex",alignItems:"center",justifyContent:"center",
    fontFamily:"'Segoe UI',system-ui,sans-serif",color:"white",padding:12,boxSizing:"border-box",
    position:"relative",userSelect:"none",WebkitUserSelect:"none",touchAction:"none",
    WebkitTouchCallout:"none",overscrollBehavior:"none"};

  // ── 선택 화면 ───────────────────────────────────────────────────────
  if(phase==="select"){
    const cur=step,sel=cur===1?p1Z:p2Z;
    return h("div",{style:rootStyle},
      h(Nebula),h(BgStars,{stars:bgStars}),
      h("div",{style:{position:"relative",zIndex:10,width:"100%",maxWidth:520,display:"flex",flexDirection:"column",alignItems:"center",gap:14}},
        h("h1",{style:{fontSize:"clamp(26px,7vw,40px)",fontWeight:900,margin:0,background:"linear-gradient(135deg,#FFE66D,#FF6B6B,#B8A9C9)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"✨ 별까기 ✨"),
        h("p",{style:{fontSize:13,color:"rgba(255,255,255,0.5)",margin:0}},"바둑알로 즐기는 별자리 대전!"),
        h("div",{style:{padding:"8px 18px",borderRadius:20,fontSize:13,fontWeight:700,border:"1.5px solid",backdropFilter:"blur(10px)",
          background:cur===1?"rgba(255,107,107,0.25)":"rgba(78,205,196,0.25)",borderColor:cur===1?"#FF6B6B":"#4ECDC4"}},
          `${cur===1?"🔴":"🔵"} 플레이어 ${cur}의 별자리를 선택하세요!`),
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:6,width:"100%"}},
          ZODIAC.map(z=>{
            const dis=cur===2&&p1Z?.id===z.id,isSel=sel?.id===z.id;
            return h("div",{key:z.id,
              style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"8px 4px",borderRadius:10,
                border:`1.5px solid ${isSel?z.color:"rgba(255,255,255,0.1)"}`,
                background:isSel?`${z.color}22`:"rgba(255,255,255,0.04)",
                opacity:dis?0.3:1,transform:isSel?"scale(1.06)":"scale(1)",
                cursor:dis?"not-allowed":"pointer",transition:"all 0.2s",gap:3,
                boxShadow:isSel?`0 0 20px ${z.glowColor}`:"none"},
              onClick:()=>{if(dis)return;cur===1?setP1Z(z):setP2Z(z);}},
              h("div",{style:{fontSize:20}},z.emoji),
              h("div",{style:{fontSize:10,color:z.color,fontWeight:700}},z.name),
              h("div",{style:{fontSize:9,color:"rgba(255,255,255,0.5)"}},z.month)
            );
          })
        ),
        sel&&h("div",{style:{width:"100%",padding:14,borderRadius:12,border:`1.5px solid ${sel.color}`,background:`${sel.color}15`,display:"flex",flexDirection:"column",gap:8,backdropFilter:"blur(10px)"}},
          h("div",{style:{fontSize:14,fontWeight:800}},`${sel.emoji} ${sel.name} — ${sel.skillIcon} ${sel.skillName}`),
          h("div",{style:{fontSize:11,color:"rgba(255,255,255,0.5)",fontWeight:600}},"📖 신화 이야기"),
          h("div",{style:{fontSize:12,color:"rgba(255,255,255,0.75)",lineHeight:1.6}},sel.myth),
          h("div",{style:{padding:"6px 10px",borderRadius:8,fontSize:11,border:`1px solid ${sel.color}`,background:`${sel.color}33`,color:"rgba(255,255,255,0.9)"}},
            `⚡ 특수 스킬: ${sel.skillDesc}`)
        ),
        step===1
          ?h("button",{style:{padding:"11px 28px",borderRadius:24,border:"none",cursor:"pointer",fontWeight:800,fontSize:14,color:"white",background:p1Z?p1Z.color:"#555",opacity:p1Z?1:0.4},
              onClick:()=>{if(p1Z)setStep(2);}},"다음 → 플레이어 2 선택")
          :h("div",{style:{display:"flex",gap:12,justifyContent:"center"}},
              h("button",{style:{padding:"11px 28px",borderRadius:24,border:"none",cursor:"pointer",fontWeight:800,fontSize:14,color:"white",background:"#555"},onClick:()=>setStep(1)},"← 뒤로"),
              h("button",{style:{padding:"11px 28px",borderRadius:24,border:"none",cursor:"pointer",fontWeight:800,fontSize:14,color:p2Z?"#111":"#fff",background:p2Z?"#FFE66D":"#555",opacity:p2Z?1:0.4},
                onClick:()=>{if(p2Z)startGame();}},"🚀 게임 시작!")
            ),
        h("div",{style:{fontSize:11,color:"rgba(255,255,255,0.45)",textAlign:"center",background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"10px 14px",lineHeight:1.7,width:"100%"}},
          h("b",null,"🎮 게임 방법"),"   별을 드래그해서 당겼다 놓으면 발사! 상대 별을 밖으로 밀어내면 승리!")
      )
    );
  }

  // ── 결과 화면 ───────────────────────────────────────────────────────
  if(phase==="result"){
    const wz=winner===1?p1Z:p2Z;
    return h("div",{style:rootStyle},
      h(Nebula),h(BgStars,{stars:bgStars}),
      h("div",{style:{position:"relative",zIndex:10,textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",gap:16}},
        h("div",{style:{fontSize:70,animation:"spin 2s linear infinite"}},wz?.emoji),
        h("h1",{style:{fontSize:"clamp(26px,7vw,40px)",fontWeight:900,margin:0,color:wz?.color}},`플레이어 ${winner} 승리!`),
        h("p",{style:{color:"rgba(255,255,255,0.7)",fontSize:15}},`${wz?.name}의 신화가 하늘에 새겨졌어요!`),
        h("p",{style:{color:"rgba(255,255,255,0.5)",fontSize:12,maxWidth:340}},`⭐ ${wz?.myth}`),
        h("button",{style:{padding:"12px 32px",borderRadius:24,border:"none",cursor:"pointer",fontWeight:800,fontSize:15,color:"#000",background:wz?.color},
          onClick:()=>{setPhase("select");setStep(1);setP1Z(null);setP2Z(null);setStars([]);}},
          "🔄 다시 하기")
      )
    );
  }

  // ── 게임 화면 ───────────────────────────────────────────────────────
  const p1Stars=stars.filter(s=>s.player===1),p2Stars=stars.filter(s=>s.player===2);
  const p1Live=p1Stars.filter(s=>s.alive).length,p2Live=p2Stars.filter(s=>s.alive).length;
  const curZ=turn===1?p1Z:p2Z;

  function getLiveLines(arr){
    const alive=arr.filter(s=>s.alive);
    if(alive.length<2)return[];
    return alive.slice(0,-1).map((s,i)=>({x1:s.x,y1:s.y,x2:alive[i+1].x,y2:alive[i+1].y}));
  }

  return h("div",{style:{...rootStyle,animation:shake?"shake 0.4s ease":"none"}},
    h(Nebula),h(BgStars,{stars:bgStars}),
    tint&&h("div",{style:{position:"fixed",inset:0,zIndex:50,pointerEvents:"none",background:tint,animation:"tintFlash 1.8s ease forwards"}}),
    cinematic&&h(SkillCinematic,{zodiac:cinematic.zodiac,flavorText:cinematic.flavorText,onClose:()=>setCinematic(null)}),

    h("div",{style:{position:"relative",zIndex:10,width:"100%",maxWidth:540,display:"flex",flexDirection:"column",gap:10}},
      // HUD
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}},
        h(HudCard,{zodiac:p1Z,liveCount:p1Live,isActive:turn===1,player:1}),
        h("div",{style:{textAlign:"center",padding:"6px 12px",borderRadius:10,background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",minWidth:110}},
          h("div",{style:{fontSize:10,color:"rgba(255,255,255,0.5)",marginBottom:2}},"현재 차례"),
          h("div",{style:{fontSize:15,fontWeight:800,color:curZ?.color}},`${curZ?.emoji} ${curZ?.name}`)
        ),
        h(HudCard,{zodiac:p2Z,liveCount:p2Live,isActive:turn===2,player:2})
      ),

      // 게임판
      h("div",{style:{width:"100%",aspectRatio:"1",borderRadius:16,overflow:"hidden",border:"2px solid rgba(255,255,255,0.08)",boxShadow:"0 0 40px rgba(0,0,100,0.5)"}},
        h("svg",{ref:svgRef,viewBox:`0 0 ${B} ${B}`,style:{width:"100%",height:"100%",display:"block",touchAction:"none"}},
          h("defs",null,
            h("radialGradient",{id:"bg",cx:"50%",cy:"50%",r:"70%"},
              h("stop",{offset:"0%",stopColor:"#0d1b3e"}),
              h("stop",{offset:"100%",stopColor:"#060d1e"})
            )
          ),
          h("rect",{width:B,height:B,fill:"url(#bg)",rx:12}),
          h("line",{x1:B/2,y1:0,x2:B/2,y2:B,stroke:"rgba(255,255,255,0.07)",strokeWidth:1,strokeDasharray:"8,8"}),
          // 완성된 별자리 선
          ...lines[1].map((l,i)=>h("line",{key:`cl1${i}`,x1:l.x1,y1:l.y1,x2:l.x2,y2:l.y2,stroke:p1Z?.color,strokeWidth:1.5,opacity:0.5,strokeDasharray:"4,4"})),
          ...lines[2].map((l,i)=>h("line",{key:`cl2${i}`,x1:l.x1,y1:l.y1,x2:l.x2,y2:l.y2,stroke:p2Z?.color,strokeWidth:1.5,opacity:0.5,strokeDasharray:"4,4"})),
          // 실시간 별자리 연결
          ...getLiveLines(p1Stars).map((l,i)=>h("line",{key:`ll1${i}`,x1:l.x1,y1:l.y1,x2:l.x2,y2:l.y2,stroke:p1Z?.color,strokeWidth:1,opacity:0.25})),
          ...getLiveLines(p2Stars).map((l,i)=>h("line",{key:`ll2${i}`,x1:l.x1,y1:l.y1,x2:l.x2,y2:l.y2,stroke:p2Z?.color,strokeWidth:1,opacity:0.25})),
          // 드래그 가이드
          drag&&dragPos&&(()=>{
            const star=stars.find(s=>s.id===drag.id);if(!star)return null;
            const dx=star.x-dragPos.x,dy=star.y-dragPos.y,len=Math.hypot(dx,dy);
            return h("g",null,
              h("line",{x1:star.x,y1:star.y,x2:dragPos.x,y2:dragPos.y,stroke:"rgba(255,255,255,0.4)",strokeWidth:2,strokeDasharray:"6,4"}),
              h("circle",{cx:dragPos.x,cy:dragPos.y,r:5,fill:"rgba(255,255,255,0.3)"}),
              len>10&&h("line",{x1:star.x,y1:star.y,x2:star.x+dx/len*40,y2:star.y+dy/len*40,stroke:"rgba(255,220,100,0.8)",strokeWidth:2.5})
            );
          })(),
          // 파티클
          ...particles.map(p=>h("circle",{key:p.id,cx:p.x,cy:p.y,r:3,fill:p.color,opacity:0.8},
            h("animate",{attributeName:"opacity",from:"0.8",to:"0",dur:"0.8s",fill:"freeze"}),
            h("animate",{attributeName:"r",from:"3",to:"1",dur:"0.8s",fill:"freeze"})
          )),
          // 별
          ...stars.map(star=>{
            if(!star.alive)return null;
            const z=star.player===1?p1Z:p2Z;
            const isDrag=drag?.id===star.id;
            return h("g",{key:star.id,
              onMouseDown:e=>onStarDown(e,star),
              onTouchStart:e=>{e.preventDefault();e.stopPropagation();onStarDown(e,star);},
              style:{cursor:star.player===turn?"grab":"default"}},
              h(StarShape,{x:star.x,y:star.y,r:isDrag?R*1.15:R,color:z?.color||"#fff",glow:z?.glowColor,
                glowing:isDrag||star.glowing,frozen:star.frozen,shielded:star.shielded})
            );
          })
        )
      ),

      // 하단
      h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
        log&&h("div",{style:{textAlign:"center",fontSize:12,padding:"8px 14px",background:"rgba(255,255,255,0.06)",borderRadius:10,color:"rgba(255,255,255,0.8)",border:"1px solid rgba(255,255,255,0.08)"}},log),
        h("div",{style:{display:"flex",flexDirection:"column",gap:6,background:"rgba(255,255,255,0.04)",borderRadius:12,padding:"10px 14px",border:"1px solid rgba(255,255,255,0.07)"}},
          h("div",{style:{textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.5)"}},`${curZ?.skillIcon} ${curZ?.skillName}`),
          h("button",{
            style:{padding:"10px 18px",borderRadius:10,border:`1.5px solid ${cd[turn]===0?curZ?.color:"#444"}`,fontWeight:700,fontSize:13,cursor:"pointer",transition:"all 0.2s",
              background:cd[turn]===0?`${curZ?.color}33`:"rgba(100,100,100,0.3)",color:cd[turn]===0?curZ?.color:"#666"},
            onClick:doSkill},
            cd[turn]>0?`🔒 ${cd[turn]}턴 후 사용 가능`:`⚡ 스킬 사용! (${curZ?.skillName})`),
          h("div",{style:{fontSize:10,color:"rgba(255,255,255,0.4)",textAlign:"center"}},curZ?.skillDesc)
        )
      )
    )
  );
}

function Nebula(){
  return h("div",{style:{position:"fixed",inset:0,zIndex:0,pointerEvents:"none",overflow:"hidden"}},
    [{top:"10%",left:"5%",w:300,h:200,c:"rgba(100,60,180,0.12)"},
     {top:"60%",right:"5%",w:250,h:180,c:"rgba(60,120,200,0.1)"},
     {top:"30%",left:"50%",w:200,h:200,c:"rgba(180,60,120,0.08)"}]
    .map((n,i)=>h("div",{key:i,style:{position:"absolute",top:n.top,left:n.left,right:n.right,width:n.w,height:n.h,borderRadius:"50%",background:`radial-gradient(ellipse,${n.c},transparent)`,filter:"blur(30px)"}}))
  );
}

function BgStars({stars}){
  return h("svg",{style:{position:"fixed",inset:0,width:"100%",height:"100%",zIndex:0,pointerEvents:"none"},viewBox:"0 0 100 100",preserveAspectRatio:"none"},
    stars.map((s,i)=>h("circle",{key:i,cx:s.x,cy:s.y,r:s.r*0.3,fill:"white",opacity:0.7},
      h("animate",{attributeName:"opacity",values:"0.7;0.1;0.7",dur:`${s.dur}s`,begin:`${s.delay}s`,repeatCount:"indefinite"})
    ))
  );
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
